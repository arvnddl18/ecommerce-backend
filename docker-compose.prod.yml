services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ecommerce-prod-app
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Dedicated Queue Worker container (uses same app image without extra RAM footprint)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ecommerce-prod-worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env.production
    depends_on:
      - app
    networks:
      - ecommerce-network

  # Dedicated Scheduler container (replaces host crontab)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: ecommerce-prod-scheduler
    restart: always
    command: php artisan schedule:work
    env_file:
      - .env.production
    depends_on:
      - app
    networks:
      - ecommerce-network

  webserver:
    image: nginx:alpine
    container_name: ecommerce-prod-webserver
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ecommerce-network

  db:
    image: postgres:16-alpine
    container_name: ecommerce-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce_user} -d ${DB_DATABASE:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge
